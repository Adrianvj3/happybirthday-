<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Felicidades, Tía Juana!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-top: #fff5f7;
      --bg-bottom: #ffe8d6;
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #d9536f;
      --secondary: #f4a261;
      --text-dark: #3d2c2e;
      --text-muted: #6b5357;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Quicksand', sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      overflow-x: hidden;
    }

    canvas#confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(217, 83, 111, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: fadeUp 0.9s ease-out both;
    }

    .badge {
      display: inline-block;
      background: #ffe3e8;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      color: var(--primary);
      line-height: 1.15;
      margin-bottom: 24px;
    }

    .divider {
      width: 72px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 999px;
      margin: 0 auto 28px;
    }

    .message {
      font-size: 1.12rem;
      line-height: 1.8;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .highlight {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text-dark);
      margin: 26px 0;
    }
