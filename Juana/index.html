<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Felicidades, Mamy! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
      background-size: 200% 200%;
      animation: bgShift 10s ease infinite;
      overflow: hidden;
      color: #3a2e39;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    canvas#confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Pantalla inicial: Regalo */
    #intro {
      text-align: center;
      z-index: 5;
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #intro.hidden {
      opacity: 0;
      transform: scale(1.2);
      pointer-events: none;
      position: absolute;
    }

    .gift-box {
      font-size: 6rem;
      display: inline-block;
      animation: bounce 1.6s infinite;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.15));
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-14px) rotate(-4deg); }
      50% { transform: translateY(0) rotate(4deg); }
      75% { transform: translateY(-8px) rotate(-2deg); }
    }

    .intro-text {
      margin-top: 16px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #d94e67;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    /* Tarjeta principal */
    .card {
      position: relative;
      z-index: 5;
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 26px;
      text-align: center;
      box-shadow: 0 22px 50px rgba(58, 46, 57, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.9);
      display: none;
      animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .card.visible {
      display: block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(2rem, 7vw, 2.7rem);
      color: #d94e67;
      margin-bottom: 14px;
    }

    .message {
      font-size: 1.12rem;
      line-height: 1.65;
      color: #52434f;
      margin-bottom: 24px;
    }

    .message strong {
      color: #d94e67;
    }

    /* Tarta interactiva */
    .cake-container {
      margin: 22px auto 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .candles {
      display: flex;
      gap: 20px;
      margin-bottom: -4px;
      z-index: 2;
    }

    .candle {
      width: 14px;
      height: 42px;
      background: repeating-linear-gradient(
        45deg,
        #ff9a9e,
        #ff9a9e 5px,
        #ffffff 5px,
        #ffffff 10px
      );
      border-radius: 4px 4px 0 0;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .candle:hover {
      transform: scale(1.1);
    }

    .flame {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #fff7ad 10%, #ff9f1c 60%, #ff5400 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 14px #ff9f1c;
      animation: flicker 0.35s infinite alternate;
      transition: opacity 0.3s, transform 0.3s;
    }

    .candle.blown .flame {
      opacity: 0;
      transform: translateX(-50%) scale(0);
    }

    @keyframes flicker {
      from { transform: translateX(-50%) scale(1) rotate(-2deg); }
      to { transform: translateX(-50%) scale(1.08, 0.94) rotate(2deg); }
    }

    .cake-top {
      width: 150px;
      height: 22px;
      background: #ffccd5;
      border-radius: 12px 12px 4px 4px;
      border-bottom: 5px solid #ff8fab;
    }

    .cake-base {
      width: 142px;
      height: 46px;
      background: #f4a261;
      border-radius: 0 0 12px 12px;
      box-shadow: inset 0 -10px 0 #e76f51;
    }

    .cake-hint {
      font-size: 0.92rem;
      font-weight: 600;
      color: #8c6d73;
      margin-top: 10px;
      min-height: 24px;
    }

    .cake-hint.done {
      color: #2a9d8f;
      font-size: 1rem;
    }

    /* Botón de cariño */
    .btn {
      margin-top: 20px;
      background: linear-gradient(135deg, #d94e67, #f4a261);
      color: #ffffff;
      border: none;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(217, 78, 103, 0.3);
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .floating-heart {
      position: fixed;
      font-size: 1.8rem;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 2.2s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-220px) scale(1.4); }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- 1. Regalo inicial -->
  <div id="intro">
    <div class="gift-box">🎁</div>
    <div class="intro-text">Toca aquí, Mamy ✨</div>
  </div>

  <!-- 2. Tarjeta sorpresa -->
  <main class="card" id="card">
    <h1>¡Felicidades, Mamy!</h1>

    <p class="message">
      Gracias por ser el corazón y <strong>la unión de toda nuestra familia</strong>.
      Donde estás tú, siempre hay hogar, risas y el mejor cariño del mundo. ❤️
    </p>

    <div class="cake-container">
      <div class="candles">
        <div class="candle" onclick="blowCandle(this)"><div class="flame"></div></div>
        <div class="candle" onclick="blowCandle(this)"><div class="flame"></div></div>
        <div class="candle" onclick="blowCandle(this)"><div class="flame"></div></div>
      </div>
      <div class="cake-top"></div>
      <div class="cake-base"></div>
      <p class="cake-hint" id="cakeHint">Toca las velas para soplar y pedir un deseo 🕯️</p>
    </div>

    <button class="btn" id="loveBtn" type="button">
      🎉 ¡Mandar un abrazo enorme!
    </button>
  </main>

  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const colors = ['#d94e67', '#f4a261', '#e9c46a', '#2a9d8f', '#ff8fab', '#7209b7'];
    let particles = [];
    let blownCount = 0;

    const phrases = [
      '🎉 ¡Te queremos muchísimo, Mamy!',
      '❤️ ¡Eres el alma de la familia!',
      '✨ ¡Por muchos años más juntos!',
      '🥰 ¡Un abrazo gigante para ti!'
    ];
    let phraseIndex = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnConfetti(count = 100) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 100,
          w: 6 + Math.random() * 6,
          h: 10 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: 2.5 + Math.random() * 3.5,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.2
        });
      }
    }

    function spawnHearts(count = 8) {
      const icons = ['❤️', '💖', '✨', '🥰'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'floating-heart';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = (15 + Math.random() * 70) + 'vw';
        el.style.bottom = (10 + Math.random() * 25) + 'vh';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2200);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.y < canvas.height + 30);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.spin;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Abrir regalo
    document.getElementById('intro').addEventListener('click', () => {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('card').classList.add('visible');
      spawnConfetti(140);
      spawnHearts(10);
    });

    // Soplar velas
    function blowCandle(candle) {
      if (candle.classList.contains('blown')) return;
      candle.classList.add('blown');
      blownCount++;
      spawnConfetti(35);

      if (blownCount === 3) {
        const hint = document.getElementById('cakeHint');
        hint.textContent = '✨ ¡Deseo pedido! ¡A celebrarlo juntos! ✨';
        hint.classList.add('done');
        spawnConfetti(160);
        spawnHearts(14);
      }
    }

    // Botón de abrazos
    const loveBtn = document.getElementById('loveBtn');
    loveBtn.addEventListener('click', () => {
      spawnConfetti(90);
      spawnHearts(10);
      loveBtn.textContent = phrases[phraseIndex];
      phraseIndex = (phraseIndex + 1) % phrases.length;
    });
  </script>
</body>
</html>
