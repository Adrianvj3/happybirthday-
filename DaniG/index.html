<!DOCTYPE html>

<head>

  <title>¡Feliz cumpleaños, DaniG!</title>

    body {

<body>
  <main>
    <h1>
      <span class="feliz">FELIZ</span><br>
      <span class="cumple">CUMPLE</span><span class="anos">AÑOS</span>

</html>
