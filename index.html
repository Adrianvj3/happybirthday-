<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8e7">
  <title>Un lugar para celebrar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #fff8e7, #ffe5ec);
      color: #343044;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 42rem;
    }

    .sparkle {
      font-size: 3rem;
    }

    h1 {
      margin: 0.75rem 0;
      color: #e63970;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.1;
    }

    p {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      background: #4361ee;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #3048bd;
    }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✨</div>
    <h1>¡Este lugar también es para ti!</h1>
    <p>
      Este pequeño proyecto está hecho para celebrar a personas como tú,
      que estás leyendo estas palabras. Ojalá hoy encuentres aquí un motivo
      para sonreír.
    </p>
    <a href="./DaniG/">Ver la felicitación de DaniG</a>
  </main>
</body>
</html>
